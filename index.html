<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teto Béo - MrBeast Rượt Đuổi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #39c5bb;
            text-shadow: 0 0 10px rgba(57, 197, 187, 0.5);
            font-size: 22px;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border: 3px solid #39c5bb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Nút điều khiển dành riêng cho Điện thoại */
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #39c5bb, #0f3460);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #ff4060;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #e4e56c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Teto Béo - MrBeast Rượt Đuổi</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <!-- Nút cảm ứng lớn dành cho điện thoại -->
    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Biến trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HE THONG NHAC 8-BIT FLOWER / TOBY FOX (WEB AUDIO API) ---
    let audioCtx = null;
    let musicInterval = null;

    const flowerNotes = [
        261.63, 329.63, 392.00, 523.25, 493.88, 392.00, 329.63, 293.66,
        261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 293.66, 261.63,
        220.00, 261.63, 329.63, 440.00, 392.00, 329.63, 261.63, 220.00,
        196.00, 246.94, 293.66, 392.00, 349.23, 293.66, 246.94, 196.00
    ];
    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playNote(freq, duration = 0.2) {
        if (!audioCtx || isGameOver) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function startFlowerMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        stopFlowerMusic();
        noteIdx = 0;
        musicInterval = setInterval(() => {
            if (isGameRunning && !isGameOver) {
                playNote(flowerNotes[noteIdx], 0.22);
                noteIdx = (noteIdx + 1) % flowerNotes.length;
            }
        }, 220);
    }

    function stopFlowerMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // Cấu hình Miku (Player)
    const miku = {
        x: 100,
        y: 170,
        width: 40,
        height: 50,
        color: '#39c5bb',
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false
    };

    // Cấu hình MrBeast
    const mrBeast = {
        x: 20,
        y: 170,
        width: 42,
        height: 52,
        velocityY: 0,
        isJumping: false
    };

    // Vật cản Teto Béo
    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 36;
            this.height = 46;
            this.y = canvas.height - 30 - this.height;
            this.color = '#ff4060';
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y + 10, this.width, this.height - 10);

            ctx.fillStyle = '#ffdca8';
            ctx.fillRect(this.x + 5, this.y, 26, 20);

            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - 5, this.y + 5, 10, 25);
            ctx.fillRect(this.x + 31, this.y + 5, 10, 25);
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    // Vẽ Miku
    function drawMiku() {
        ctx.fillStyle = "#222";
        ctx.fillRect(miku.x + 10, miku.y + 20, 20, 20);

        ctx.fillStyle = "#ffdca8";
        ctx.fillRect(miku.x + 8, miku.y + 2, 24, 20);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x - 2, miku.y + 5, 10, 35);
        ctx.fillRect(miku.x + 32, miku.y + 5, 10, 35);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 13, miku.y + 8, 4, 6);
        ctx.fillRect(miku.x + 23, miku.y + 8, 4, 6);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 18, miku.y + 22, 4, 12);
    }

    // Vẽ MrBeast
    function drawMrBeast() {
        ctx.fillStyle = "#2b70c9";
        ctx.fillRect(mrBeast.x + 8, mrBeast.y + 20, 26, 22);

        ctx.fillStyle = "#111";
        ctx.fillRect(mrBeast.x + 10, mrBeast.y + 38, 22, 14);

        ctx.fillStyle = "#ffdfc4";
        ctx.fillRect(mrBeast.x + 9, mrBeast.y + 2, 24, 20);

        ctx.fillStyle = "#5a3d28";
        ctx.fillRect(mrBeast.x + 7, mrBeast.y, 28, 7);

        ctx.fillStyle = "#422b1b";
        ctx.fillRect(mrBeast.x + 11, mrBeast.y + 16, 20, 5);

        ctx.fillStyle = "#000";
        ctx.fillRect(mrBeast.x + 15, mrBeast.y + 8, 3, 4);
        ctx.fillRect(mrBeast.x + 24, mrBeast.y + 8, 3, 4);

        ctx.fillStyle = "#fff";
        ctx.fillRect(mrBeast.x + 17, mrBeast.y + 14, 8, 3);
    }

    function updateMrBeast() {
        if (miku.isJumping && !mrBeast.isJumping && Math.random() < 0.8) {
            mrBeast.velocityY = miku.jumpPower;
            mrBeast.isJumping = true;
        }

        mrBeast.velocityY += miku.gravity;
        mrBeast.y += mrBeast.velocityY;

        const groundY = canvas.height - 30 - mrBeast.height;
        if (mrBeast.y > groundY) {
            mrBeast.y = groundY;
            mrBeast.velocityY = 0;
            mrBeast.isJumping = false;
        }
    }

    function drawGround() {
        ctx.fillStyle = "#1f3440";
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
        ctx.fillStyle = "#39c5bb";
        ctx.fillRect(0, canvas.height - 30, canvas.width, 3);
    }

    // Xử lý hành động Nhảy / Chơi lại
    function handleAction() {
        if (!isGameRunning) {
            if (isGameOver) resetGame();
            isGameRunning = true;
            actionBtn.innerText = "NHẢY! 🚀";
            startFlowerMusic();
        }
        if (!miku.isJumping) {
            miku.velocityY = miku.jumpPower;
            miku.isJumping = true;
        }
    }

    // Lắng nghe phím máy tính
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            handleAction();
        }
    });

    // Lắng nghe sự kiện bấm nút cho điện thoại
    actionBtn.addEventListener('click', handleAction);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleAction();
    });

    function resetGame() {
        isGameOver = false;
        score = 0;
        gameSpeed = baseSpeed;
        obstacles = [];
        miku.y = 170;
        miku.velocityY = 0;
        miku.isJumping = false;
        mrBeast.y = 170;
        mrBeast.velocityY = 0;
        mrBeast.isJumping = false;
        frameCount = 0;
        actionBtn.innerText = "NHẢY! 🚀";
        actionBtn.style.background = "linear-gradient(135deg, #39c5bb, #0f3460)";
    }

    // Game Loop
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawGround();

        if (isGameRunning && !isGameOver) {
            frameCount++;
            score = Math.floor(frameCount / 4);

            // Tốc độ tăng nhanh liên tục theo thời gian
            gameSpeed = baseSpeed + (frameCount / 250);

            // Vật lý Miku
            miku.velocityY += miku.gravity;
            miku.y += miku.velocityY;

            const groundY = canvas.height - 30 - miku.height;
            if (miku.y > groundY) {
                miku.y = groundY;
                miku.velocityY = 0;
                miku.isJumping = false;
            }

            updateMrBeast();

            // Sinh ra Teto Béo (Khoảng cách xa nhau)
            let lastObstacleX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : 0;
            let minDistance = 250 + (gameSpeed * 8);

            if (frameCount % 90 === 0 && (canvas.width - lastObstacleX > minDistance)) {
                if (Math.random() < 0.75) {
                    obstacles.push(new TetoObstacle());
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                // Va chạm AABB
                if (
                    miku.x < obstacles[i].x + obstacles[i].width &&
                    miku.x + miku.width > obstacles[i].x &&
                    miku.y < obstacles[i].y + obstacles[i].height &&
                    miku.y + miku.height > obstacles[i].y
                ) {
                    isGameOver = true;
                    stopFlowerMusic();
                    actionBtn.innerText = "🔄 CHƠI LẠI (ĐIỆN THOẠI)";
                    actionBtn.style.background = "linear-gradient(135deg, #ff4060, #a00020)";
                    if (score > highScore) highScore = score;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            drawMrBeast();
            drawMiku();

            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText(`Điểm: ${score}`, 15, 30);
            ctx.fillText(`Tốc độ: ${gameSpeed.toFixed(1)}x`, 15, 50);
            ctx.fillText(`Kỷ lục: ${highScore}`, canvas.width - 120, 30);

        } else if (!isGameRunning && !isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#39c5bb';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẤM NÚT HOẶC SPACE ĐỂ BẮT ĐẦU', canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        } else if (isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
