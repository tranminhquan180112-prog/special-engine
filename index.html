<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff4060;
            text-shadow: 0 0 10px rgba(255, 64, 96, 0.5);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            border: 3px solid #ff4060;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 64, 96, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff4060, #0f3460);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #e03050;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #e4e56c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let isGameWon = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HỆ THỐNG ÂM THANH 16-BIT CHIPTUNE (AUDIO API) ---
    let audioCtx = null;
    let musicInterval = null;

    // Melody & Bassline 16-bit
    const chiptuneMelody = [
        293.66, 293.66, 587.33, 293.66, 523.25, 293.66, 440.00, 415.30,
        293.66, 293.66, 659.25, 293.66, 587.33, 523.25, 440.00, 392.00,
        293.66, 293.66, 783.99, 698.46, 587.33, 293.66, 523.25, 440.00,
        261.63, 293.66, 523.25, 587.33, 698.46, 659.25, 587.33, 523.25
    ];

    const chiptuneBass = [
        146.83, 146.83, 146.83, 146.83, 130.81, 130.81, 110.00, 103.83,
        146.83, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00,
        146.83, 146.83, 196.00, 174.61, 146.83, 146.83, 130.81, 110.00,
        65.41,  73.42,  130.81, 146.83, 174.61, 164.81, 146.83, 130.81
    ];

    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Âm thanh 16-bit Retro
    function play16BitNote(freq, duration = 0.12, type = 'square', volume = 0.08) {
        if (!audioCtx || isGameOver || isGameWon) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; // 'square' & 'sawtooth' tạo âm 16-bit chuẩn
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    // Hiệu ứng nhảy 16-bit Arpeggio
    function play16BitJumpSound() {
        if (!audioCtx) return;
        try {
            const now = audioCtx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(f, now + i * 0.025);

                gain.gain.setValueAtTime(0.12, now + i * 0.025);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.025 + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + i * 0.025);
                osc.stop(now + i * 0.025 + 0.05);
            });
        } catch (e) {}
    }

    function startMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        stopMusic();
        noteIdx = 0;
        musicInterval = setInterval(() => {
            if (isGameRunning && !isGameOver && !isGameWon) {
                // Lead 16-bit
                play16BitNote(chiptuneMelody[noteIdx], 0.11, 'square', 0.07);
                // Bass 16-bit
                play16BitNote(chiptuneBass[noteIdx], 0.13, 'sawtooth', 0.09);
                noteIdx = (noteIdx + 1) % chiptuneMelody.length;
            }
        }, 125);
    }

    function stopMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // Nhân vật Miku
    const miku = {
        x: 180,
        baseX: 180,
        y: 168,
        width: 36,
        height: 52,
        color: '#39c5bb',
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false
    };

    // Nhân vật MrBeast
    const mrBeast = {
        x: 20,
        y: 168,
        width: 42,
        height: 52,
        velocityY: 0,
        speed: 1.0,
        maxSpeed: 5.0,
        isJumping: false
    };

    // Vật cản Teto Xinh Đẹp (Ngoại hình tỉ mỉ phong cách Anime/Miku)
    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 36;
            this.height = 52;
            this.y = canvas.height - 30 - this.height;
            this.color = '#ff4060';
        }

        draw() {
            const x = this.x;
            const y = this.y;
            const drillWave = Math.sin(frameCount * 0.3) * 3;

            // --- 1. TÓC KHOAN XOẮN ĐẶC TRƯNG (Twin Drills) ---
            ctx.fillStyle = '#ff2a55';
            // Tóc bên trái
            ctx.fillRect(x - 8, y + 6 + drillWave, 8, 12);
            ctx.fillRect(x - 12, y + 16 + drillWave, 10, 14);
            ctx.fillRect(x - 8, y + 28 + drillWave, 6, 10);

            // Tóc bên phải
            ctx.fillRect(x + 36, y + 6 - drillWave, 8, 12);
            ctx.fillRect(x + 38, y + 16 - drillWave, 10, 14);
            ctx.fillRect(x + 38, y + 28 - drillWave, 6, 10);

            // --- 2. VÁY & TRANG PHỤC (Outfit) ---
            // Váy đỏ xếp ly
            ctx.fillStyle = '#cc0033';
            ctx.fillRect(x + 6, y + 30, 24, 10);

            // Áo croptop đen
            ctx.fillStyle = '#222226';
            ctx.fillRect(x + 8, y + 18, 20, 13);

            // Nơ đỏ trước ngực
            ctx.fillStyle = '#ff0044';
            ctx.fillRect(x + 15, y + 20, 6, 4);

            // Ca-vát/Viền đỏ
            ctx.fillStyle = '#ff4060';
            ctx.fillRect(x + 17, y + 24, 2, 7);

            // --- 3. ĐẦU & KHUÔN MẶT (Face & Hair) ---
            // Mặt (Làn da)
            ctx.fillStyle = '#ffe0cb';
            ctx.fillRect(x + 6, y + 2, 24, 18);

            // Mái tóc đỏ
            ctx.fillStyle = '#ff2a55';
            ctx.fillRect(x + 4, y, 28, 7);
            ctx.fillRect(x + 4, y + 6, 4, 8);  // Tóc mái trái
            ctx.fillRect(x + 28, y + 6, 4, 8); // Tóc mái phải
            ctx.fillRect(x + 15, y + 6, 6, 6); // Tóc mái giữa

            // Đôi mắt màu đỏ ruby
            ctx.fillStyle = '#d60036';
            ctx.fillRect(x + 10, y + 8, 4, 6);
            ctx.fillRect(x + 22, y + 8, 4, 6);

            // Điểm sáng trong mắt
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 11, y + 9, 2, 2);
            ctx.fillRect(x + 23, y + 9, 2, 2);

            // Bánh mì Pháp (Baguette) cài bên vai
            ctx.fillStyle = '#d48b38';
            ctx.fillRect(x + 26, y + 16, 8, 14);
            ctx.fillStyle = '#f0b067';
            ctx.fillRect(x + 28, y + 18, 4, 10);

            // --- 4. CHÂN & TẤT ĐÙI (Legs & Boots) ---
            // Đùi
            ctx.fillStyle = '#ffe0cb';
            ctx.fillRect(x + 10, y + 38, 6, 4);
            ctx.fillRect(x + 20, y + 38, 6, 4);

            // Tất đùi đen (Over-knee socks) & Giày
            ctx.fillStyle = '#18181c';
            ctx.fillRect(x + 10, y + 40, 6, 12);
            ctx.fillRect(x + 20, y + 40, 6, 12);

            // Đế giày màu đỏ
            ctx.fillStyle = '#ff0044';
            ctx.fillRect(x + 9, y + 50, 8, 2);
            ctx.fillRect(x + 19, y + 50, 8, 2);
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    // --- HỆ THỐNG PHÔNG NỀN VÀ GIỚI HẠN TỐC ĐỘ THEO KHU VỰC ---
    let locationText = "";
    let currentMaxSpeed = 7.0;

    function drawBackground() {
        if (score < 500) {
            locationText = "📍 Địa điểm: The Backrooms (Tối đa: 7.0x)";
            currentMaxSpeed = 7.0;

            ctx.fillStyle = "#c2b280";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#a89868";
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect((i - (frameCount * (gameSpeed * 0.2)) % 40), 0, 18, canvas.height - 30);
            }

            ctx.fillStyle = "rgba(255, 255, 200, 0.25)";
            ctx.fillRect(100, 10, 120, 12);
            ctx.fillRect(450, 10, 120, 12);

            ctx.fillStyle = "#5c5238";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#3d3623";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 3);

        } else if (score >= 500 && score < 1500) {
            locationText = "📍 Địa điểm: Đường phố Nước Mỹ (Tối đa: 8.5x)";
            currentMaxSpeed = 8.5;

            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#1a252f";
            ctx.fillRect(50, 60, 90, 160);
            ctx.fillRect(180, 40, 110, 180);
            ctx.fillRect(320, 80, 100, 140);
            ctx.fillRect(460, 30, 120, 190);

            ctx.fillStyle = "#f1c40f";
            for (let bx = 60; bx < 560; bx += 70) {
                for (let by = 70; by < 180; by += 25) {
                    if ((bx + by) % 3 === 0) ctx.fillRect(bx, by, 10, 12);
                }
            }

            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            ctx.fillStyle = "#f1c40f";
            for (let rx = 0; rx < canvas.width; rx += 60) {
                ctx.fillRect((rx - (frameCount * gameSpeed) % 60), canvas.height - 16, 30, 4);
            }

        } else if (score >= 1500 && score < 2500) {
            locationText = "📍 Địa điểm: Shibuya (Tối đa: 10.0x)";
            currentMaxSpeed = 10.0;

            ctx.fillStyle = "#0d0221";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#190933";
            ctx.fillRect(80, 30, 140, 190);
            ctx.fillRect(260, 20, 180, 200);
            ctx.fillRect(480, 40, 130, 180);

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(100, 50, 100, 50);
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(280, 40, 140, 70);

            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px Arial";
            ctx.fillText("SHIBUYA 109", 295, 80);

            ctx.fillStyle = "#222";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ffffff";
            for (let sx = 0; sx < canvas.width; sx += 30) {
                ctx.fillRect((sx - (frameCount * gameSpeed) % 30), canvas.height - 28, 12, 26);
            }

        } else if (score >= 2500 && score < 3400) {
            locationText = "📍 Địa điểm: Tokyo (Tối đa: 12.5x)";
            currentMaxSpeed = 12.5;

            ctx.fillStyle = "#050b14";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#ff3300";
            ctx.beginPath();
            ctx.moveTo(350, 20);
            ctx.lineTo(310, 220);
            ctx.lineTo(390, 220);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(338, 70, 24, 15);
            ctx.fillRect(330, 130, 40, 20);

            ctx.fillStyle = "#1a1a24";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 2);

        } else if (score >= 3400 && score < 3500) {
            locationText = "📍 Địa điểm: Nhà Trắng (Tối đa: 13.5x)";
            currentMaxSpeed = 13.5;

            ctx.fillStyle = "#70b5f5";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            let cloudX = (frameCount * 0.8) % (canvas.width + 100);
            ctx.beginPath();
            ctx.arc(canvas.width - cloudX, 40, 20, 0, Math.PI * 2);
            ctx.arc(canvas.width - cloudX + 25, 35, 25, 0, Math.PI * 2);
            ctx.arc(canvas.width - cloudX + 50, 40, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f0f4f8";
            ctx.fillRect(150, 60, 400, 160);
            ctx.fillStyle = "#e1e8ed";
            ctx.fillRect(250, 40, 200, 180);

            ctx.fillStyle = "#ffffff";
            for (let c = 270; c <= 410; c += 28) {
                ctx.fillRect(c, 70, 14, 150);
            }

            ctx.fillStyle = "#d0d7de";
            ctx.beginPath();
            ctx.moveTo(240, 40);
            ctx.lineTo(350, 10);
            ctx.lineTo(460, 40);
            ctx.fill();

            ctx.fillStyle = "#b22234";
            ctx.fillRect(348, -5, 20, 12);
            ctx.fillStyle = "#fff";
            ctx.fillRect(348, -5, 20, 2);
            ctx.fillRect(348, 1, 20, 2);
            ctx.fillRect(348, 7, 20, 2);
            ctx.fillStyle = "#3c3b6e";
            ctx.fillRect(348, -5, 8, 6);

            ctx.fillStyle = "#2e8b57";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

        } else {
            locationText = "🎬 Địa điểm: Hậu trường MrBeast (Tối đa: 15.0x)";
            currentMaxSpeed = 15.0;

            ctx.fillStyle = "#111116";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#00ff40";
            ctx.fillRect(120, 30, 460, 160);

            ctx.fillStyle = "#ffea00";
            ctx.beginPath();
            ctx.arc(80, 30, 20, 0, Math.PI * 2);
            ctx.arc(620, 30, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#00d4ff";
            ctx.font = "bold 24px Arial";
            ctx.fillText("MRBEAST STUDIO", 235, 110);

            ctx.fillStyle = "#22222a";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 3);
        }
    }

    // Vẽ Miku
    function drawMiku() {
        const hairWave = Math.sin(frameCount * 0.2) * 4;

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x - 10, miku.y + 6 + hairWave, 10, 32);
        ctx.fillRect(miku.x + miku.width, miku.y + 6 - hairWave, 10, 32);

        ctx.fillStyle = "#222";
        ctx.fillRect(miku.x + 8, miku.y + 20, 20, 18);
        ctx.fillStyle = "#fff";
        ctx.fillRect(miku.x + 10, miku.y + 20, 16, 10);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 16, miku.y + 22, 4, 12);

        ctx.fillStyle = "#ffdca8";
        ctx.fillRect(miku.x + 6, miku.y + 2, 24, 18);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 4, miku.y, 28, 7);

        ctx.fillStyle = "#008b8b";
        ctx.fillRect(miku.x + 11, miku.y + 8, 4, 6);
        ctx.fillRect(miku.x + 21, miku.y + 8, 4, 6);

        ctx.fillStyle = "#111";
        ctx.fillRect(miku.x + 10, miku.y + 38, 6, 14);
        ctx.fillRect(miku.x + 20, miku.y + 38, 6, 14);
    }

    // Vẽ MrBeast
    function drawMrBeast() {
        ctx.fillStyle = "#2b70c9";
        ctx.fillRect(mrBeast.x + 8, mrBeast.y + 20, 26, 22);

        ctx.fillStyle = "#111";
        ctx.fillRect(mrBeast.x + 10, mrBeast.y + 38, 22, 14);

        ctx.fillStyle = "#ffdfc4";
        ctx.fillRect(mrBeast.x + 9, mrBeast.y + 2, 24, 20);

        ctx.fillStyle = "#5a3d28";
        ctx.fillRect(mrBeast.x + 7, mrBeast.y, 28, 7);

        ctx.fillStyle = "#422b1b";
        ctx.fillRect(mrBeast.x + 11, mrBeast.y + 16, 20, 5);

        ctx.fillStyle = "#000";
        ctx.fillRect(mrBeast.x + 15, mrBeast.y + 8, 3, 4);
        ctx.fillRect(mrBeast.x + 24, mrBeast.y + 8, 3, 4);

        ctx.fillStyle = "#fff";
        ctx.fillRect(mrBeast.x + 17, mrBeast.y + 14, 8, 3);
    }

    function updateMrBeast() {
        if (miku.isJumping && !mrBeast.isJumping && Math.random() < 0.85) {
            mrBeast.velocityY = miku.jumpPower;
            mrBeast.isJumping = true;
        }

        mrBeast.velocityY += miku.gravity;
        mrBeast.y += mrBeast.velocityY;

        const groundY = canvas.height - 30 - mrBeast.height;
        if (mrBeast.y > groundY) {
            mrBeast.y = groundY;
            mrBeast.velocityY = 0;
            mrBeast.isJumping = false;
        }

        if (mrBeast.speed < mrBeast.maxSpeed) {
            mrBeast.speed += 0.01;
        }

        if (mrBeast.x < miku.x - 40) {
            mrBeast.x += (mrBeast.speed / mrBeast.maxSpeed) * 0.35;
        }
    }

    function handleAction(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (!isGameRunning || isGameOver || isGameWon) {
            resetGame();
            isGameRunning = true;
            actionBtn.innerText = "NHẢY! 🚀";
            startMusic();
            return;
        }

        if (!miku.isJumping) {
            miku.velocityY = miku.jumpPower;
            miku.isJumping = true;
            play16BitJumpSound();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            handleAction();
        }
    });

    actionBtn.addEventListener('touchstart', handleAction, { passive: false });
    actionBtn.addEventListener('click', handleAction);
    canvas.addEventListener('touchstart', handleAction, { passive: false });

    function resetGame() {
        isGameOver = false;
        isGameWon = false;
        score = 0;
        gameSpeed = baseSpeed;
        obstacles = [];
        miku.x = miku.baseX;
        miku.y = 168;
        miku.velocityY = 0;
        miku.isJumping = false;
        mrBeast.x = 20;
        mrBeast.y = 168;
        mrBeast.speed = 1.0;
        mrBeast.velocityY = 0;
        mrBeast.isJumping = false;
        frameCount = 0;
        actionBtn.innerText = "NHẢY! 🚀";
        actionBtn.style.background = "linear-gradient(135deg, #ff4060, #0f3460)";
    }

    function triggerGameOver() {
        isGameOver = true;
        stopMusic();
        actionBtn.innerText = "🔄 CHƠI LẠI (ĐIỆN THOẠI)";
        actionBtn.style.background = "linear-gradient(135deg, #ff4060, #a00020)";
        if (score > highScore) highScore = score;
    }

    function triggerGameWin() {
        isGameWon = true;
        score = 3600;
        stopMusic();
        actionBtn.innerText = "🏆 CHƠI LẠI TRÒ CHƠI";
        actionBtn.style.background = "linear-gradient(135deg, #39c5bb, #2e8b57)";
        if (score > highScore) highScore = score;
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        if (isGameRunning && !isGameOver && !isGameWon) {
            frameCount++;
            score = Math.floor(frameCount / 4);

            if (score >= 3600) {
                triggerGameWin();
            }

            let calculatedSpeed = baseSpeed + (frameCount / 250);
            gameSpeed = Math.min(calculatedSpeed, currentMaxSpeed);

            miku.velocityY += miku.gravity;
            miku.y += miku.velocityY;

            const groundY = canvas.height - 30 - miku.height;
            if (miku.y > groundY) {
                miku.y = groundY;
                miku.velocityY = 0;
                miku.isJumping = false;
            }

            if (miku.x < miku.baseX) {
                miku.x += 0.5;
            }

            updateMrBeast();

            let lastObstacleX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : 0;
            let minDistance = 260 + (gameSpeed * 8);

            if (frameCount % 90 === 0 && (canvas.width - lastObstacleX > minDistance)) {
                if (Math.random() < 0.75) {
                    obstacles.push(new TetoObstacle());
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (
                    miku.x < obstacles[i].x + obstacles[i].width &&
                    miku.x + miku.width > obstacles[i].x &&
                    miku.y < obstacles[i].y + obstacles[i].height &&
                    miku.y + miku.height > obstacles[i].y
                ) {
                    miku.x -= 12;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (mrBeast.x + mrBeast.width >= miku.x + 5) {
                triggerGameOver();
            }

            drawMrBeast();
            drawMiku();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Điểm: ${score}`, 15, 30);
            ctx.fillText(`Tốc độ: ${gameSpeed.toFixed(1)}x`, 15, 50);
            ctx.fillText(`Kỷ lục: ${highScore}`, canvas.width - 120, 30);

            ctx.fillStyle = '#ffea00';
            ctx.font = '13px Arial';
            ctx.fillText(locationText, 15, 70);

        } else if (!isGameRunning && !isGameOver && !isGameWon) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẤM NÚT HOẶC SPACE ĐỂ BẮT ĐẦU', canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        } else if (isGameWon) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffea00';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẠN ĐÃ THẮNG 5TR ĐÔ!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space để chơi lại', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        } else if (isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẠN ĐÃ MẤT 5TR ĐÔ!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
