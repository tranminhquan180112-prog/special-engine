<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f111a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            border: 2px solid #1a233a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.15);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00f0ff, #0052cc);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #003db3;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #8a99ad;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let isGameWon = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HỆ THỐNG ÂM THANH SYNTHWAVE ---
    let audioCtx = null;
    let musicInterval = null;

    const melody = [
        293.66, 293.66, 587.33, 293.66, 523.25, 293.66, 440.00, 415.30,
        293.66, 293.66, 659.25, 293.66, 587.33, 523.25, 440.00, 392.00
    ];

    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playNote(freq, duration = 0.12, type = 'sine', volume = 0.05) {
        if (!audioCtx || isGameOver || isGameWon) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration
