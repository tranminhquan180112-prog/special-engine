<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff4060;
            text-shadow: 0 0 10px rgba(255, 64, 96, 0.5);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            border: 3px solid #ff4060;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 64, 96, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff4060, #0f3460);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #e03050;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #e4e56c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let isGameWon = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HỆ THỐNG ÂM THANH (AUDIO API) ---
    let audioCtx = null;
    let musicInterval = null;

    const mrBeastRemixNotes = [
        146.83, 146.83, 293.66, 146.83, 261.63, 146.83, 220.00, 207.65,
        146.83, 146.83, 329.63, 146.83, 293.66, 261.63, 220.00, 196.00,
        146.83, 146.83, 392.00, 349.23, 293.66, 146.83, 261.63, 220.00,
        130.81, 146.83, 261.63, 293.66, 349.23, 329.63, 293.66, 261.63
    ];
    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playNote(freq, duration = 0.14) {
        if (!audioCtx || isGameOver || isGameWon) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    // Tiếng Teto kêu khi nhảy
    function playTetoJumpSound() {
        if (!audioCtx) return;
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.12);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.12);
        } catch (e) {}
    }

    function startMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        stopMusic();
        noteIdx = 0;
        musicInterval = setInterval(() => {
            if (isGameRunning && !isGameOver && !isGameWon) {
                playNote(mrBeastRemixNotes[noteIdx], 0.15);
                noteIdx = (noteIdx + 1) % mrBeastRemixNotes.length;
            }
        }, 135);
    }

    function stopMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // Nhân vật Miku
    const miku = {
        x: 180,
        baseX: 180,
        y: 168,
        width: 36,
        height: 52,
        color: '#39c5bb',
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false
    };

    // Nhân vật MrBeast
    const mrBeast = {
        x: 20,
        y: 168,
        width: 42,
        height: 52,
        velocityY: 0,
        speed: 1.0,
        maxSpeed: 5.0,
        isJumping: false
    };

    // Vật cản Teto Béo
    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 44;
            this.height = 46;
            this.y = canvas.height - 30 - this.height;
            this.color = '#ff4060';
        }

        draw() {
            ctx.fillStyle = '#ff4060';
            ctx.fillRect(this.x + 4, this.y + 16, 36, 26);
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x + 18, this.y + 18, 8, 20);

            ctx.fillStyle = '#ffdca8';
            ctx.fillRect(this.x + 8, this.y + 4, 28, 18);

            ctx.fillStyle = '#d62845';
            ctx.fillRect(this.x - 4, this.y + 6, 12, 14);
            ctx.fillRect(this.x + 36, this.y + 6, 12, 14);
            ctx.fillRect(this.x + 6, this.y, 32, 8);

            ctx.fillStyle = '#b3002d';
            ctx.fillRect(this.x + 14, this.y + 10, 4, 5);
            ctx.fillRect(this.x + 26, this.y + 10, 4, 5);
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    // --- HỆ THỐNG PHÔNG NỀN THEO CHÍNH XÁC CÁC MỐC ĐIỂM ---
    let locationText = "";

    function drawBackground() {
        if (score < 500) {
            // < 500đ: Backrooms
            locationText = "📍 Địa điểm: The Backrooms";
            ctx.fillStyle = "#c2b280";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#a89868";
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect((i - (frameCount * (gameSpeed * 0.2)) % 40), 0, 18, canvas.height - 30);
            }

            ctx.fillStyle = "rgba(255, 255, 200, 0.25)";
            ctx.fillRect(100, 10, 120, 12);
            ctx.fillRect(450, 10, 120, 12);

            ctx.fillStyle = "#5c5238";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#3d3623";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 3);

        } else if (score >= 500 && score < 1500) {
            // 500 - 1499đ: Ngoài đường ở nước Mỹ
            locationText = "📍 Địa điểm: Đường phố Nước Mỹ";
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#1a252f";
            ctx.fillRect(50, 60, 90, 160);
            ctx.fillRect(180, 40, 110, 180);
            ctx.fillRect(320, 80, 100, 140);
            ctx.fillRect(460, 30, 120, 190);

            ctx.fillStyle = "#f1c40f";
            for (let bx = 60; bx < 560; bx += 70) {
                for (let by = 70; by < 180; by += 25) {
                    if ((bx + by) % 3 === 0) ctx.fillRect(bx, by, 10, 12);
                }
            }

            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            ctx.fillStyle = "#f1c40f";
            for (let rx = 0; rx < canvas.width; rx += 60) {
                ctx.fillRect((rx - (frameCount * gameSpeed) % 60), canvas.height - 16, 30, 4);
            }

        } else if (score >= 1500 && score < 2500) {
            // 1500 - 2499đ: Shibuya
            locationText = "📍 Địa điểm: Shibuya (Nhật Bản)";
            ctx.fillStyle = "#0d0221";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#190933";
            ctx.fillRect(80, 30, 140, 190);
            ctx.fillRect(260, 20, 180, 200);
            ctx.fillRect(480, 40, 130, 180);

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(100, 50, 100, 50);
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(280, 40, 140, 70);

            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px Arial";
            ctx.fillText("SHIBUYA 109", 295, 80);

            ctx.fillStyle = "#222";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ffffff";
            for (let sx = 0; sx < canvas.width; sx += 30) {
                ctx.fillRect((sx - (frameCount * gameSpeed) % 30), canvas.height - 28, 12, 26);
            }

        } else if (score >= 2500 && score < 3400) {
            // 2500 - 3399đ: Tokyo
            locationText = "📍 Địa điểm: Tokyo";
            ctx.fillStyle = "#050b14";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            // Tháp Tokyo
            ctx.fillStyle = "#ff3300";
            ctx.beginPath();
            ctx.moveTo(350, 20);
            ctx.lineTo(310, 220);
            ctx.lineTo(390, 220);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(338, 70, 24, 15);
            ctx.fillRect(330, 130, 40, 20);

            ctx.fillStyle = "#1a1a24";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 2);

        } else if (score >= 3400 && score < 3500) {
            // 3400 - 3499đ: Nhà Trắng của Mỹ
            locationText = "📍 Địa điểm: Nhà Trắng của Mỹ";
            ctx.fillStyle = "#70b5f5";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            let cloudX = (frameCount * 0.8) % (canvas.width + 100);
            ctx.beginPath();
            ctx.arc(canvas.width - cloudX, 40, 20, 0, Math.PI * 2);
            ctx.arc(canvas.width - cloudX + 25, 35, 25, 0, Math.PI * 2);
            ctx.arc(canvas.width - cloudX + 50, 40, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f0f4f8";
            ctx.fillRect(150, 60, 400, 160);
            ctx.fillStyle = "#e1e8ed";
            ctx.fillRect(250, 40, 200, 180);

            ctx.fillStyle = "#ffffff";
            for (let c = 270; c <= 410; c += 28) {
                ctx.fillRect(c, 70, 14, 150);
            }

            ctx.fillStyle = "#d0d7de";
            ctx.beginPath();
            ctx.moveTo(240, 40);
            ctx.lineTo(350, 10);
            ctx.lineTo(460, 40);
            ctx.fill();

            ctx.fillStyle = "#b22234";
            ctx.fillRect(348, -5, 20, 12);
            ctx.fillStyle = "#fff";
            ctx.fillRect(348, -5, 20, 2);
            ctx.fillRect(348, 1, 20, 2);
            ctx.fillRect(348, 7, 20, 2);
            ctx.fillStyle = "#3c3b6e";
            ctx.fillRect(348, -5, 8, 6);

            ctx.fillStyle = "#2e8b57";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

        } else {
            // ≥ 3500đ: Hậu trường của MrBeast
            locationText = "🎬 Địa điểm: Hậu trường của MrBeast";
            ctx.fillStyle = "#111116";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            ctx.fillStyle = "#00ff40";
            ctx.fillRect(120, 30, 460, 160);

            ctx.fillStyle = "#ffea00";
            ctx.beginPath();
            ctx.arc(80, 30, 20, 0, Math.PI * 2);
            ctx.arc(620, 30, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#00d4ff";
            ctx.font = "bold 24px Arial";
            ctx.fillText("MRBEAST STUDIO", 235, 110);

            ctx.fillStyle = "#22222a";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 3);
        }
    }

    // Vẽ Miku
    function drawMiku() {
        const hairWave = Math.sin(frameCount * 0.2) * 4;

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x - 10, miku.y + 6 + hairWave, 10, 32);
        ctx.fillRect(miku.x + miku.width, miku.y + 6 - hairWave, 10, 32);

        ctx.fillStyle = "#222";
        ctx.fillRect(miku.x + 8, miku.y + 20, 20, 18);
        ctx.fillStyle = "#fff";
        ctx.fillRect(miku.x + 10, miku.y + 20, 16, 10);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 16, miku.y + 22, 4, 12);

        ctx.fillStyle = "#ffdca8";
        ctx.fillRect(miku.x + 6, miku.y + 2, 24, 18);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 4, miku.y, 28, 7);

        ctx.fillStyle = "#008b8b";
        ctx.fillRect(miku.x + 11, miku.y + 8, 4, 6);
        ctx.fillRect(miku.x + 21, miku.y + 8, 4, 6);

        ctx.fillStyle = "#111";
        ctx.fillRect(miku.x + 10, miku.y + 38, 6, 14);
        ctx.fillRect(miku.x + 20, miku.y + 38, 6, 14);
    }

    // Vẽ MrBeast
    function drawMrBeast() {
        ctx.fillStyle = "#2b70c9";
        ctx.fillRect(mrBeast.x + 8, mrBeast.y + 20, 26, 22);

        ctx.fillStyle = "#111";
        ctx.fillRect(mrBeast.x + 10, mrBeast.y + 38, 22, 14);

        ctx.fillStyle = "#ffdfc4";
        ctx.fillRect(mrBeast.x + 9, mrBeast.y + 2, 24, 20);

        ctx.fillStyle = "#5a3d28";
        ctx.fillRect(mrBeast.x + 7, mrBeast.y, 28, 7);

        ctx.fillStyle = "#422b1b";
        ctx.fillRect(mrBeast.x + 11, mrBeast.y + 16, 20, 5);

        ctx.fillStyle = "#000";
        ctx.fillRect(mrBeast.x + 15, mrBeast.y + 8, 3, 4);
        ctx.fillRect(mrBeast.x + 24, mrBeast.y + 8, 3, 4);

        ctx.fillStyle = "#fff";
        ctx.fillRect(mrBeast.x + 17, mrBeast.y + 14, 8, 3);
    }

    function updateMrBeast() {
        if (miku.isJumping && !mrBeast.isJumping && Math.random() < 0.85) {
            mrBeast.velocityY = miku.jumpPower;
            mrBeast.isJumping = true;
        }

        mrBeast.velocityY += miku.gravity;
        mrBeast.y += mrBeast.velocityY;

        const groundY = canvas.height - 30 - mrBeast.height;
        if (mrBeast.y > groundY) {
            mrBeast.y = groundY;
            mrBeast.velocityY = 0;
            mrBeast.isJumping = false;
        }

        if (mrBeast.speed < mrBeast.maxSpeed) {
            mrBeast.speed += 0.01;
        }

        if (mrBeast.x < miku.x - 40) {
            mrBeast.x += (mrBeast.speed / mrBeast.maxSpeed) * 0.35;
        }
    }

    function handleAction(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (!isGameRunning || isGameOver || isGameWon) {
            resetGame();
            isGameRunning = true;
            actionBtn.innerText = "NHẢY! 🚀";
            startMusic();
            return;
        }

        if (!miku.isJumping) {
            miku.velocityY = miku.jumpPower;
            miku.isJumping = true;
            playTetoJumpSound();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            handleAction();
        }
    });

    actionBtn.addEventListener('touchstart', handleAction, { passive: false });
    actionBtn.addEventListener('click', handleAction);
    canvas.addEventListener('touchstart', handleAction, { passive: false });

    function resetGame() {
        isGameOver = false;
        isGameWon = false;
        score = 0;
        gameSpeed = baseSpeed;
        obstacles = [];
        miku.x = miku.baseX;
        miku.y = 168;
        miku.velocityY = 0;
        miku.isJumping = false;
        mrBeast.x = 20;
        mrBeast.y = 168;
        mrBeast.speed = 1.0;
        mrBeast.velocityY = 0;
        mrBeast.isJumping = false;
        frameCount = 0;
        actionBtn.innerText = "NHẢY! 🚀";
        actionBtn.style.background = "linear-gradient(135deg, #ff4060, #0f3460)";
    }

    function triggerGameOver() {
        isGameOver = true;
        stopMusic();
        actionBtn.innerText = "🔄 CHƠI LẠI (ĐIỆN THOẠI)";
        actionBtn.style.background = "linear-gradient(135deg, #ff4060, #a00020)";
        if (score > highScore) highScore = score;
    }

    function triggerGameWin() {
        isGameWon = true;
        score = 3600;
        stopMusic();
        actionBtn.innerText = "🏆 CHƠI LẠI TRÒ CHƠI";
        actionBtn.style.background = "linear-gradient(135deg, #39c5bb, #2e8b57)";
        if (score > highScore) highScore = score;
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        if (isGameRunning && !isGameOver && !isGameWon) {
            frameCount++;
            score = Math.floor(frameCount / 4);

            if (score >= 3600) {
                triggerGameWin();
            }

            gameSpeed = baseSpeed + (frameCount / 250);

            miku.velocityY += miku.gravity;
            miku.y += miku.velocityY;

            const groundY = canvas.height - 30 - miku.height;
            if (miku.y > groundY) {
                miku.y = groundY;
                miku.velocityY = 0;
                miku.isJumping = false;
            }

            if (miku.x < miku.baseX) {
                miku.x += 0.5;
            }

            updateMrBeast();

            let lastObstacleX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : 0;
            let minDistance = 260 + (gameSpeed * 8);

            if (frameCount % 90 === 0 && (canvas.width - lastObstacleX > minDistance)) {
                if (Math.random() < 0.75) {
                    obstacles.push(new TetoObstacle());
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (
                    miku.x < obstacles[i].x + obstacles[i].width &&
                    miku.x + miku.width > obstacles[i].x &&
                    miku.y < obstacles[i].y + obstacles[i].height &&
                    miku.y + miku.height > obstacles[i].y
                ) {
                    miku.x -= 12;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (mrBeast.x + mrBeast.width >= miku.x + 5) {
                triggerGameOver();
            }

            drawMrBeast();
            drawMiku();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Điểm: ${score}`, 15, 30);
            ctx.fillText(`Tốc độ: ${gameSpeed.toFixed(1)}x`, 15, 50);
            ctx.fillText(`Kỷ lục: ${highScore}`, canvas.width - 120, 30);

            ctx.fillStyle = '#ffea00';
            ctx.font = '13px Arial';
            ctx.fillText(locationText, 15, 70);

        } else if (!isGameRunning && !isGameOver && !isGameWon) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẤM NÚT HOẶC SPACE ĐỂ BẮT ĐẦU', canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        } else if (isGameWon) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffea00';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẠN ĐÃ THẮNG 5TR ĐÔ!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space để chơi lại', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        } else if (isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẠN ĐÃ MẤT 5TR ĐÔ!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
