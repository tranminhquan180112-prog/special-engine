<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff4060;
            text-shadow: 0 0 10px rgba(255, 64, 96, 0.5);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            border: 3px solid #ff4060;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 64, 96, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff4060, #0f3460);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #e03050;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #e4e56c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // --- KHỞI TẠO HÌNH ẢNH NHÂN VẬT ---
    // Thay đường dẫn URL bên dưới bằng ảnh PNG/GIF nét của bạn nếu muốn
    const mikuImg = new Image();
    mikuImg.src = 'https://i.imgur.com/2Xy3Z5M.png'; // Link ảnh Hatsune Miku mẫu

    const tetoImg = new Image();
    tetoImg.src = 'https://i.imgur.com/uVf8kLp.png'; // Link ảnh Kasane Teto mẫu

    let isGameRunning = false;
    let isGameOver = false;
    let isGameWon = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    let audioCtx = null;
    let musicInterval = null;

    const melody32Bit = [
        293.66, 293.66, 587.33, 293.66, 523.25, 293.66, 440.00, 415.30,
        293.66, 293.66, 659.25, 293.66, 587.33, 523.25, 440.00, 392.00
    ];

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function play32BitJumpSound() {
        if (!audioCtx) return;
        try {
            const now = audioCtx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, now + i * 0.02);
                gain.gain.setValueAtTime(0.1, now + i * 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.02 + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.02);
                osc.stop(now + i * 0.02 + 0.06);
            });
        } catch (e) {}
    }

    const miku = {
        x: 180,
        baseX: 180,
        y: 160,
        width: 48,
        height: 60,
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false,

        draw() {
            if (mikuImg.complete && mikuImg.naturalWidth !== 0) {
                // Vẽ bằng ảnh mikuImg
                ctx.drawImage(mikuImg, this.x, this.y, this.width, this.height);
            } else {
                // Khối màu dự phòng nếu ảnh chưa tải xong
                ctx.fillStyle = '#39c5bb';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    };

    const mrBeast = {
        x: 20,
        y: 168,
        width: 42,
        height: 52,
        velocityY: 0,
        speed: 1.0,
        maxSpeed: 5.0,
        isJumping: false
    };

    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 48;
            this.height = 60;
            this.y = canvas.height - 30 - this.height;
        }

        draw() {
            if (tetoImg.complete && tetoImg.naturalWidth !== 0) {
                ctx.drawImage(tetoImg, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = '#ff4060';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    function drawBackground() {
        ctx.fillStyle = "#111116";
        ctx.fillRect(0, 0, canvas.width, canvas.height - 30);
        ctx.fillStyle = "#22222a";
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    }

    function drawMrBeast() {
        ctx.fillStyle = "#2b70c9";
        ctx.fillRect(mrBeast.x + 8, mrBeast.y + 20, 26, 22);
        ctx.fillStyle = "#ffdfc4";
        ctx.fillRect(mrBeast.x + 9, mrBeast.y + 2, 24, 20);
    }

    function updateMrBeast() {
        if (miku.isJumping && !mrBeast.isJumping && Math.random() < 0.85) {
            mrBeast.velocityY = miku.jumpPower;
            mrBeast.isJumping = true;
        }
        mrBeast.velocityY += miku.gravity;
        mrBeast.y += mrBeast.velocityY;
        const groundY = canvas.height - 30 - mrBeast.height;
        if (mrBeast.y > groundY) {
            mrBeast.y = groundY;
            mrBeast.velocityY = 0;
            mrBeast.isJumping = false;
        }
    }

    function handleAction(e) {
        if (e) e.preventDefault();
        initAudio();
        if (!isGameRunning || isGameOver || isGameWon) {
            resetGame();
            isGameRunning = true;
            return;
        }
        if (!miku.isJumping) {
            miku.velocityY = miku.jumpPower;
            miku.isJumping = true;
            play32BitJumpSound();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleAction();
    });
    actionBtn.addEventListener('click', handleAction);

    function resetGame() {
        isGameOver = false;
        isGameWon = false;
        score = 0;
        gameSpeed = baseSpeed;
        obstacles = [];
        miku.x = miku.baseX;
        miku.y = 160;
        miku.velocityY = 0;
        miku.isJumping = false;
        mrBeast.x = 20;
        mrBeast.y = 168;
        frameCount = 0;
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        if (isGameRunning && !isGameOver) {
            frameCount++;
            score = Math.floor(frameCount / 4);

            miku.velocityY += miku.gravity;
            miku.y += miku.velocityY;
            const groundY = canvas.height - 30 - miku.height;
            if (miku.y > groundY) {
                miku.y = groundY;
                miku.velocityY = 0;
                miku.isJumping = false;
            }

            updateMrBeast();

            if (frameCount % 90 === 0) {
                obstacles.push(new TetoObstacle());
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            drawMrBeast();
            miku.draw();
        } else {
            drawMrBeast();
            miku.draw();
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
