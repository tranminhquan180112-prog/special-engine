<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff4060;
            text-shadow: 0 0 10px rgba(255, 64, 96, 0.5);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border: 3px solid #39c5bb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #39c5bb, #0f3460);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #ff4060;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #e4e56c;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Biến trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HE THONG NHAC 8-BIT: "LOOPING THE ROOMS" ---
    let audioCtx = null;
    let musicInterval = null;

    const loopingNotes = [
        311.13, 349.23, 392.00, 466.16, 415.30, 392.00, 349.23, 311.13,
        261.63, 311.13, 349.23, 392.00, 349.23, 311.13, 293.66, 261.63,
        233.08, 261.63, 311.13, 392.00, 349.23, 311.13, 261.63, 233.08,
        207.65, 261.63, 311.13, 415.30, 392.00, 349.23, 311.13, 261.63
    ];
    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playNote(freq, duration = 0.18) {
        if (!audioCtx || isGameOver) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function startMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        stopMusic();
        noteIdx = 0;
        musicInterval = setInterval(() => {
            if (isGameRunning && !isGameOver) {
                playNote(loopingNotes[noteIdx], 0.18);
                noteIdx = (noteIdx + 1) % loopingNotes.length;
            }
        }, 170);
    }

    function stopMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // Cấu hình Miku (Player)
    const miku = {
        x: 180,
        baseX: 180,
        y: 168,
        width: 36,
        height: 52,
        color: '#39c5bb',
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false
    };

    // Cấu hình MrBeast
    const mrBeast = {
        x: 30,
        y: 168,
        width: 42,
        height: 52,
        velocityY: 0,
        isJumping: false
    };

    // Vật cản Teto Béo
    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 44;
            this.height = 46;
            this.y = canvas.height - 30 - this.height;
            this.color = '#ff4060';
        }

        draw() {
            ctx.fillStyle = '#ff4060';
            ctx.fillRect(this.x + 4, this.y + 16, 36, 26);
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x + 18, this.y + 18, 8, 20);

            ctx.fillStyle = '#ffdca8';
            ctx.fillRect(this.x + 8, this.y + 4, 28, 18);

            ctx.fillStyle = '#d62845';
            ctx.fillRect(this.x - 4, this.y + 6, 12, 14);
            ctx.fillRect(this.x + 36, this.y + 6, 12, 14);
            ctx.fillRect(this.x + 6, this.y, 32, 8);

            ctx.fillStyle = '#b3002d';
            ctx.fillRect(this.x + 14, this.y + 10, 4, 5);
            ctx.fillRect(this.x + 26, this.y + 10, 4, 5);
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    // Vẽ Miku
    function drawMiku() {
        const hairWave = Math.sin(frameCount * 0.2) * 4;

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x - 10, miku.y + 6 + hairWave, 10, 32);
        ctx.fillRect(miku.x + miku.width, miku.y + 6 - hairWave, 10, 32);

        ctx.fillStyle = "#222";
        ctx.fillRect(miku.x + 8, miku.y + 20, 20, 18);
        ctx.fillStyle = "#fff";
        ctx.fillRect(miku.x + 10, miku.y + 20, 16, 10);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 16, miku.y + 22, 4, 12);

        ctx.fillStyle = "#ffdca8";
        ctx.fillRect(miku.x + 6, miku.y + 2, 24, 18);

        ctx.fillStyle = miku.color;
        ctx.fillRect(miku.x + 4, miku.y, 28, 7);

        ctx.fillStyle = "#008b8b";
        ctx.fillRect(miku.x + 11, miku.y + 8, 4, 6);
        ctx.fillRect(miku.x + 21, miku.y + 8, 4, 6);

        ctx.fillStyle = "#111";
        ctx.fillRect(miku.x + 10, miku.y + 38, 6, 14);
        ctx.fillRect(miku.x + 20, miku.y + 38, 6, 14);
    }

    // Vẽ MrBeast
    function drawMrBeast() {
        ctx.fillStyle = "#2b70c9";
        ctx.fillRect(mrBeast.x + 8, mrBeast.y + 20, 26, 22);

        ctx.fillStyle = "#111";
        ctx.fillRect(mrBeast.x + 10, mrBeast.y + 38, 22, 14);

        ctx.fillStyle = "#ffdfc4";
        ctx.fillRect(mrBeast.x + 9, mrBeast.y + 2, 24, 20);

        ctx.fillStyle = "#5a3d28";
        ctx.fillRect(mrBeast.x + 7, mrBeast.y, 28, 7);

        ctx.fillStyle = "#422b1b";
        ctx.fillRect(mrBeast.x + 11, mrBeast.y + 16, 20, 5);

        ctx.fillStyle = "#000";
        ctx.fillRect(mrBeast.x + 15, mrBeast.y + 8, 3, 4);
        ctx.fillRect(mrBeast.x + 24, mrBeast.y + 8, 3, 4);

        ctx.fillStyle = "#fff";
        ctx.fillRect(mrBeast.x + 17, mrBeast.y + 14, 8, 3);
    }

    function updateMrBeast() {
        if (miku.isJumping && !mrBeast.isJumping && Math.random() < 0.85) {
            mrBeast.velocityY = miku.jumpPower;
            mrBeast.isJumping = true;
        }

        mrBeast.velocityY += miku.gravity;
        mrBeast.y += mrBeast.velocityY;

        const groundY = canvas.height - 30 - mrBeast.height;
        if (mrBeast.y > groundY) {
            mrBeast.y = groundY;
            mrBeast.velocityY = 0;
            mrBeast.isJumping = false;
        }

        if (mrBeast.x < miku.x - 40) {
            mrBeast.x += 0.3;
        }
    }

    function drawGround() {
        ctx.fillStyle = "#1f3440";
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
        ctx.fillStyle = "#39c5bb";
        ctx.fillRect(0, canvas.height - 30, canvas.width, 3);
    }

    function handleAction() {
        if (!isGameRunning) {
            if (isGameOver) resetGame();
            isGameRunning = true;
            actionBtn.innerText = "NHẢY! 🚀";
            startMusic();
        }
        if (!miku.isJumping) {
            miku.velocityY = miku.jumpPower;
            miku.isJumping = true;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            handleAction();
        }
    });

    actionBtn.addEventListener('click', handleAction);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleAction();
    });

    function resetGame() {
        isGameOver = false;
        score = 0;
        gameSpeed = baseSpeed;
        obstacles = [];
        miku.x = miku.baseX;
        miku.y = 168;
        miku.velocityY = 0;
        miku.isJumping = false;
        mrBeast.x = 30;
        mrBeast.y = 168;
        mrBeast.velocityY = 0;
        mrBeast.isJumping = false;
        frameCount = 0;
        actionBtn.innerText = "NHẢY! 🚀";
        actionBtn.style.background = "linear-gradient(135deg, #39c5bb, #0f3460)";
    }

    function triggerGameOver() {
        isGameOver = true;
        stopMusic();
        actionBtn.innerText = "🔄 CHƠI LẠI (ĐIỆN THOẠI)";
        actionBtn.style.background = "linear-gradient(135deg, #ff4060, #a00020)";
        if (score > highScore) highScore = score;
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawGround();

        if (isGameRunning && !isGameOver) {
            frameCount++;
            score = Math.floor(frameCount / 4);

            gameSpeed = baseSpeed + (frameCount / 250);

            miku.velocityY += miku.gravity;
            miku.y += miku.velocityY;

            const groundY = canvas.height - 30 - miku.height;
            if (miku.y > groundY) {
                miku.y = groundY;
                miku.velocityY = 0;
                miku.isJumping = false;
            }

            if (miku.x < miku.baseX) {
                miku.x += 0.5;
            }

            updateMrBeast();

            let lastObstacleX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : 0;
            let minDistance = 260 + (gameSpeed * 8);

            if (frameCount % 90 === 0 && (canvas.width - lastObstacleX > minDistance)) {
                if (Math.random() < 0.75) {
                    obstacles.push(new TetoObstacle());
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (
                    miku.x < obstacles[i].x + obstacles[i].width &&
                    miku.x + miku.width > obstacles[i].x &&
                    miku.y < obstacles[i].y + obstacles[i].height &&
                    miku.y + miku.height > obstacles[i].y
                ) {
                    miku.x -= 12;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (mrBeast.x + mrBeast.width >= miku.x + 5) {
                triggerGameOver();
            }

            drawMrBeast();
            drawMiku();

            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText(`Điểm: ${score}`, 15, 30);
            ctx.fillText(`Tốc độ: ${gameSpeed.toFixed(1)}x`, 15, 50);
            ctx.fillText(`Kỷ lục: ${highScore}`, canvas.width - 120, 30);

        } else if (!isGameRunning && !isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#39c5bb';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BẤM NÚT HOẶC SPACE ĐỂ BẮT ĐẦU', canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        } else if (isGameOver) {
            drawMrBeast();
            drawMiku();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4060';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            // Dòng thông báo khi MrBeast bắt được
            ctx.fillText('BẠN ĐÃ MẤT 5TR ĐÔ!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Bấm nút "CHƠI LẠI" hoặc phím Space', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
