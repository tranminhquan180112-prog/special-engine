<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nếu để tôi bắt đc bạn sẽ mất 5tr đô - Vampire Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0204;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff003c;
            text-shadow: 0 0 12px rgba(255, 0, 60, 0.8);
            font-size: 20px;
            text-align: center;
            padding: 0 10px;
            letter-spacing: 1px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 250px;
            border: 3px solid #ff003c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mobile-btn {
            margin-top: 15px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff003c, #4a0011);
            border: 2px solid #fff;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
            cursor: pointer;
            outline: none;
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #b3002a;
        }
        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #ffcccc;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Nếu để tôi bắt đc bạn sẽ mất 5tr đô</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="250"></canvas>
    </div>

    <button id="actionBtn" class="mobile-btn">BẮT ĐẦU / NHẢY 🚀</button>
    <div id="instructions">Máy tính: Nhấn Phím Cách (Space) để Nhảy / Chơi lại</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');

    // Tạo pattern Halftone / Dot Filter (Chấm bi ô vuông mảng tối chuẩn MV Vampire)
    const patternCanvas = document.createElement('canvas');
    patternCanvas.width = 4;
    patternCanvas.height = 4;
    const pCtx = patternCanvas.getContext('2d');
    pCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    pCtx.fillRect(0, 0, 2, 2);
    pCtx.fillRect(2, 2, 2, 2);
    const halftonePattern = ctx.createPattern(patternCanvas, 'repeat');

    // Trạng thái Game
    let isGameRunning = false;
    let isGameOver = false;
    let isGameWon = false;
    let score = 0;
    let highScore = 0;
    let baseSpeed = 5;
    let gameSpeed = 5;
    let frameCount = 0;

    // --- HỆ THỐNG ÂM THANH 32-BIT SYNTHWAVE ---
    let audioCtx = null;
    let musicInterval = null;

    const melody32Bit = [
        293.66, 293.66, 587.33, 293.66, 523.25, 293.66, 440.00, 415.30,
        293.66, 293.66, 659.25, 293.66, 587.33, 523.25, 440.00, 392.00,
        293.66, 293.66, 783.99, 698.46, 587.33, 293.66, 523.25, 440.00,
        261.63, 293.66, 523.25, 587.33, 698.46, 659.25, 587.33, 523.25
    ];

    const harmony32Bit = [
        369.99, 369.99, 739.99, 369.99, 659.25, 369.99, 554.37, 523.25,
        369.99, 369.99, 830.61, 369.99, 739.99, 659.25, 554.37, 493.88,
        369.99, 369.99, 987.77, 880.00, 739.99, 369.99, 659.25, 554.37,
        329.63, 369.99, 659.25, 739.99, 880.00, 830.61, 739.99, 659.25
    ];

    const bass32Bit = [
        146.83, 146.83, 146.83, 146.83, 130.81, 130.81, 110.00, 103.83,
        146.83, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00,
        146.83, 146.83, 196.00, 174.61, 146.83, 146.83, 130.81, 110.00,
        65.41,  73.42,  130.81, 146.83, 174.61, 164.81, 146.83, 130.81
    ];

    let noteIdx = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function play32BitNote(freq, duration = 0.14, type = 'triangle', volume = 0.08) {
        if (!audioCtx || isGameOver || isGameWon) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function play32BitJumpSound() {
        if (!audioCtx) return;
        try {
            const now = audioCtx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            freqs.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, now + i * 0.02);

                gain.gain.setValueAtTime(0.1, now + i * 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.02 + 0.06);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + i * 0.02);
                osc.stop(now + i * 0.02 + 0.06);
            });
        } catch (e) {}
    }

    function startMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        stopMusic();
        noteIdx = 0;
        musicInterval = setInterval(() => {
            if (isGameRunning && !isGameOver && !isGameWon) {
                play32BitNote(melody32Bit[noteIdx], 0.13, 'triangle', 0.08);
                play32BitNote(harmony32Bit[noteIdx], 0.11, 'square', 0.03);
                play32BitNote(bass32Bit[noteIdx], 0.14, 'sawtooth', 0.09);

                noteIdx = (noteIdx + 1) % melody32Bit.length;
            }
        }, 125);
    }

    function stopMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // --- MIKU (PHONG CÁCH VAMPIRE DECO*27) ---
    const miku = {
        x: 180,
        baseX: 180,
        y: 160,
        width: 45,
        height: 60,
        velocityY: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        isJumping: false,

        draw() {
            const x = this.x;
            const y = this.y;
            const wave = Math.sin(frameCount * 0.2) * 3;

            ctx.save();

            // 1. TÓC BỘC TWIN-TAILS (GÓC NHIÊNG CHUẨN MV)
            ctx.fillStyle = '#d4f5f5'; // Tóc bạch kim xám xanh nhạt chuẩn Vampire
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 15);
            ctx.quadraticCurveTo(x - 20, y + 20 + wave, x - 18, y + 55 + wave);
            ctx.quadraticCurveTo(x - 5, y + 40, x + 12, y + 25);
            ctx.fill();

            // Phủ Halftone trên tóc
            ctx.fillStyle = halftonePattern;
            ctx.fill();

            // Nơ buộc tóc nơ đen to (Vampire Bow)
            ctx.fillStyle = '#111116';
            ctx.beginPath();
            ctx.arc(x + 8, y + 16, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff003c';
            ctx.fillRect(x + 6, y + 14, 4, 4);

            // 2. TRANG PHỤC VÂY VÀ ÁO
            ctx.fillStyle = '#fca5a5'; // Áo hồng nhạt Pop-art
            ctx.fillRect(x + 12, y + 28, 22, 16);

            ctx.fillStyle = '#111116'; // Khẩu trang kéo xuống cằm (Vampire Mask)
            ctx.beginPath();
            ctx.arc(x + 22, y + 26, 9, 0, Math.PI);
            ctx.fill();
            // Chữ Vampire nhỏ
            ctx.fillStyle = '#fff';
            ctx.font = '8px Arial';
            ctx.fillText('Vampire', x + 16, y + 31);

            // Váy xếp ly đen
            ctx.fillStyle = '#111116';
            ctx.fillRect(x + 10, y + 42, 26, 12);

            // 3. KHUÔN MẶT & RĂNG NANH VAMPIRE
            ctx.fillStyle = '#fff5eb';
            ctx.beginPath();
            ctx.moveTo(x + 15, y + 10);
            ctx.lineTo(x + 35, y + 18); // Nhọn góc nghiêng
            ctx.lineTo(x + 20, y + 28);
            ctx.closePath();
            ctx.fill();

            // Miệng mở & Răng nanh Ma Cà Rồng
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 30, y + 21, 5, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#fff'; // Răng nanh nhọn
            ctx.beginPath();
            ctx.moveTo(x + 27, y + 19); ctx.lineTo(x + 29, y + 23); ctx.lineTo(x + 30, y + 19);
            ctx.fill();

            // Mắt Vampire sắc bén
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.ellipse(x + 25, y + 16, 3, 5, -Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.fillRect(x + 24, y + 14, 3, 2);

            // Trái tim nhỏ dưới mắt
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 28, y + 19, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Tóc mái bạch kim
            ctx.fillStyle = '#e2f8f8';
            ctx.beginPath();
            ctx.arc(x + 22, y + 13, 11, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    };

    // --- MRBEAST (CÙNG PHONG CÁCH MV VAMPIRE) ---
    const mrBeast = {
        x: 20,
        y: 160,
        width: 45,
        height: 60,
        velocityY: 0,
        speed: 1.0,
        maxSpeed: 5.0,
        isJumping: false,

        draw() {
            const x = this.x;
            const y = this.y;

            ctx.save();

            // Quần Đen Pop-Art
            ctx.fillStyle = '#111116';
            ctx.fillRect(x + 12, y + 42, 22, 18);

            // Áo Hoodie Đỏ Đậm Vampire
            ctx.fillStyle = '#990022';
            ctx.fillRect(x + 10, y + 24, 26, 20);

            // Pattern Halftone phủ lên áo
            ctx.fillStyle = halftonePattern;
            ctx.fillRect(x + 10, y + 24, 26, 20);

            // Logo Báo Neon
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(x + 18, y + 28);
            ctx.lineTo(x + 28, y + 28);
            ctx.lineTo(x + 23, y + 36);
            ctx.closePath();
            ctx.fill();

            // Mặt & Râu quai nón Pop-art nghiêng
            ctx.fillStyle = '#fff5eb';
            ctx.beginPath();
            ctx.moveTo(x + 15, y + 10);
            ctx.lineTo(x + 35, y + 18);
            ctx.lineTo(x + 20, y + 28);
            ctx.closePath();
            ctx.fill();

            // Miệng mở Răng nanh
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 30, y + 21, 4, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(x + 28, y + 19); ctx.lineTo(x + 30, y + 23); ctx.lineTo(x + 31, y + 19);
            ctx.fill();

            // Râu Pop-Art
            ctx.fillStyle = '#221111';
            ctx.fillRect(x + 20, y + 23, 10, 4);

            // Tóc Nâu gợn
            ctx.fillStyle = '#3a1d1d';
            ctx.beginPath();
            ctx.arc(x + 22, y + 12, 11, Math.PI * 0.8, Math.PI * 2.1);
            ctx.fill();

            // Mắt đỏ ma mị
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 26, y + 16, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    };

    // --- KASANE TETO (PHONG CÁCH VAMPIRE) ---
    class TetoObstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 45;
            this.height = 60;
            this.y = canvas.height - 30 - this.height;
        }

        draw() {
            const x = this.x;
            const y = this.y;
            const wave = Math.sin(frameCount * 0.2) * 3;

            ctx.save();

            // Tóc khoan Twin-Drills Đỏ thẫm
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.ellipse(x - 5, y + 22 + wave, 8, 18, Math.PI / 5, 0, Math.PI * 2);
            ctx.ellipse(x + 48, y + 22 - wave, 8, 18, -Math.PI / 5, 0, Math.PI * 2);
            ctx.fill();

            // Pattern Halftone trên tóc Teto
            ctx.fillStyle = halftonePattern;
            ctx.fill();

            // Trang phục đen & Đỏ rực
            ctx.fillStyle = '#111116';
            ctx.fillRect(x + 10, y + 26, 26, 28);
            ctx.fillStyle = '#ff003c';
            ctx.fillRect(x + 8, y + 38, 30, 8);

            // Bánh mì Baguette góc nghiêng
            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.ellipse(x + 34, y + 34, 4, 12, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Mặt Vampire
            ctx.fillStyle = '#fff5eb';
            ctx.beginPath();
            ctx.moveTo(x + 15, y + 10);
            ctx.lineTo(x + 35, y + 18);
            ctx.lineTo(x + 20, y + 28);
            ctx.closePath();
            ctx.fill();

            // Răng nanh
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 30, y + 21, 5, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(x + 28, y + 19); ctx.lineTo(x + 30, y + 23); ctx.lineTo(x + 31, y + 19);
            ctx.fill();

            // Mắt đỏ
            ctx.fillStyle = '#ff003c';
            ctx.beginPath();
            ctx.arc(x + 25, y + 16, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        update() {
            this.x -= gameSpeed;
        }
    }

    let obstacles = [];

    // --- PHÔNG NỀN ĐỎ CHUẨN MV VAMPIRE (DECO*27) ---
    let locationText = "";
    let currentMaxSpeed = 7.0;

    function drawBackground() {
        // Nền đỏ Crimson rực rỡ đặc trưng
        ctx.fillStyle = '#e60033';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Lớp Phủ Halftone toàn màn hình
        ctx.fillStyle = halftonePattern;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Chữ Tiếng Nhật nghệ thuật chuẩn MV
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = 'bold 36px "Segoe UI", sans-serif';
        ctx.fillText('試したいな', 80, 80);
        ctx.fillText('試シタイナ', 460, 80);

        // Cánh dơi Vampire ở nền
        ctx.fillStyle = '#111116';
        ctx.beginPath();
        ctx.moveTo(520, 120);
        ctx.quadraticCurveTo(560, 100, 600, 130);
        ctx.quadraticCurveTo(560, 140, 520, 120);
        ctx.fill();

        // Mặt đất đen Pop-art
        ctx.fillStyle = '#111116';
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
        ctx.fillStyle = '#ff003c';
        ctx.fillRect(0, canvas.height - 30, canvas.width, 3);

        locationText = "🩸 Chế độ: Vampire
